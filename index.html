<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prof Stanlley | Vôlei de Praia | Portal</title>
    <style>
        :root { --amarelo: #FFD700; --preto: #000; --cinza: #111; }
        body { background: var(--preto); color: var(--amarelo); font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: var(--cinza); width: 90%; max-width: 380px; padding: 30px 20px; border-radius: 20px; border: 2px solid var(--amarelo); text-align: center; }
        input, select { width: 100%; padding: 15px; margin: 10px 0; border-radius: 8px; border: 1px solid #333; background: #000; color: #fff; font-size: 1rem; box-sizing: border-box; }
        button { width: 100%; padding: 16px; background: var(--amarelo); color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 10px; transition: 0.3s; }
        button:hover { opacity: 0.8; }
        button:disabled { background: #333; color: #666; cursor: not-allowed; }
        .badge { background: var(--amarelo); color: #000; padding: 4px 12px; border-radius: 50px; font-size: 0.7rem; font-weight: bold; margin: 10px 0; display: inline-block; }
        .card-info { background: #000; border: 1px dashed var(--amarelo); padding: 15px; border-radius: 10px; margin: 15px 0; text-align: center; }
        .hidden { display: none; }
        .hist-item { display: flex; justify-content: space-between; font-size: 0.8rem; padding: 10px; border-bottom: 1px solid #222; }
    </style>
</head>
<body>

<div id="loginPage" class="container">
    <h1 style="margin-bottom:0; text-transform: uppercase;">Prof. Stanlley</h1>
    <p style="font-size:0.8rem; color:#888; margin-top:5px;">Vôlei de Praia | Mercúrio Praia Clube</p>
    <input type="tel" id="telLogin" placeholder="Telefone com DDD">
    <input type="tel" id="senhaLogin" maxlength="10" placeholder="Nascimento (ex: 02071998)" oninput="mascaraData(this)">
    <button id="btnLogin" onclick="fazerLogin()">Entrar</button>
</div>

<div id="appPage" class="container hidden">
    <h2 id="nomeAluno" style="margin:0; color:#fff;">---</h2>
    <div id="planoExibido" class="badge">---</div>
    <br><button onclick="alternarDiarista()" style="width:auto; font-size:0.6rem; padding:5px; background:#222; color:#fff; border: 1px solid #444;">Mudar para Diarista</button>

    <div class="card-info">
        <span style="font-size:0.65rem; color:#888; text-transform:uppercase;">Próximo Treino</span>
        <div id="dataTreinoTexto" style="font-size:1.2rem; font-weight:bold; margin:5px 0;">--/--/----</div>
        <div id="statusLiberacao" style="font-size:0.7rem; font-weight:bold;">Verificando...</div>
    </div>

    <select id="horario" onchange="verificarRegras()">
        <option value="18:00">18:00h</option>
        <option value="19:00">19:00h</option>
        <option value="20:00">20:00h</option>
    </select>
    
    <button id="btnCheckin" onclick="fazerCheckin()">Confirmar Presença</button>

    <h3 style="margin-top:25px; font-size:0.8rem; text-transform:uppercase; border-bottom:1px solid #333; padding-bottom:5px;">Meus Treinos</h3>
    <div id="listaHistorico" style="max-height:150px; overflow-y:auto;"></div>
</div>

<script>
    const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbz1YWatewvqKyOnSajAXnrDZYF0jjDpj-odMyOI2NSX3F3xs8PFQcG9zTUJnM-6KiPHZQ/exec";
    const LINK_FORMULARIO = "https://forms.gle/UevvEvYWMDTLqYnN8";
    let USER = null;
    let modoDiarista = false;

    function mascaraData(i){
        let v = i.value.replace(/\D/g,'').slice(0,8);
        if(v.length>=5) v=v.replace(/^(\d{2})(\d{2})(\d{0,4})/,"$1/$2/$3");
        else if(v.length>=3) v=v.replace(/^(\d{2})(\d{0,2})/,"$1/$2");
        i.value = v;
    }

    async function fazerLogin() {
        const telefone = document.getElementById('telLogin').value.replace(/\D/g,'');
        const senha = document.getElementById('senhaLogin').value;
        const btn = document.getElementById('btnLogin');
        
        if(!telefone || !senha) return alert("Preencha todos os campos.");
        
        btn.disabled = true;
        btn.innerText = "VERIFICANDO...";

        try {
            const res = await fetch(URL_SCRIPT, { method:'POST', body: JSON.stringify({action:"login", telefone, senha}) });
            const json = await res.json();
            
            if(json.result === "success"){
                USER = json.data;
                document.getElementById('loginPage').classList.add('hidden');
                document.getElementById('appPage').classList.remove('hidden');
                document.getElementById('nomeAluno').innerText = USER.nome;
                document.getElementById('planoExibido').innerText = USER.plano;
                verificarRegras(); 
                carregarHistorico();
            } else if(json.result === "not_found"){
                alert(json.data); 
                window.location.href = LINK_FORMULARIO;
            } else { 
                alert(json.data); 
                btn.disabled = false;
                btn.innerText = "Entrar";
            }
        } catch(e) {
            alert("Erro de conexão. Verifique o Script.");
            btn.disabled = false;
            btn.innerText = "Entrar";
        }
    }

    function verificarRegras() {
        const agora = new Date();
        const dia = agora.getDay();
        const hora = agora.getHours();
        const plano = modoDiarista ? "Diarista" : USER.plano;
        
        let prox = new Date();
        if(dia===2 || dia===4){ /* Hoje */ }
        else if(dia<2) prox.setDate(agora.getDate()+(2-dia));
        else if(dia<4) prox.setDate(agora.getDate()+(4-dia));
        else prox.setDate(agora.getDate()+(2+(7-dia)));
        
        const dataFormatada = prox.toLocaleDateString('pt-BR');
        document.getElementById('dataTreinoTexto').innerText = dataFormatada;

        let liberado = false;
        let msg = "";
        let cor = "#FFD700"; // Cor padrão amarela

        if(plano === "Mensalista") {
            liberado = true;
            msg = "✅ INSCRIÇÃO LIBERADA";
            cor = "#00FF00";
        } else {
            const diaTreino = (dia === 2 || dia === 4);
            if(diaTreino && hora >= 12) {
                liberado = true; 
                msg = "✅ VAGAS ABERTAS";
                cor = "#00FF00";
            } else {
                msg = diaTreino ? "⏳ LIBERA ÀS 12:00 DE HOJE" : "⏳ LIBERA ÀS 12:00 DO DIA DO TREINO";
            }
        }
        document.getElementById('btnCheckin').disabled = !liberado;
        const statusEl = document.getElementById('statusLiberacao');
        statusEl.innerText = msg;
        statusEl.style.color = cor;
    }

    function alternarDiarista() {
        modoDiarista = !modoDiarista;
        document.getElementById('planoExibido').innerText = modoDiarista ? "Diarista" : USER.plano;
        verificarRegras();
    }

    async function fazerCheckin() {
        const btn = document.getElementById('btnCheckin');
        btn.disabled = true; 
        btn.innerText = "RESERVANDO...";
        try {
            const res = await fetch(URL_SCRIPT, { method:'POST', body: JSON.stringify({
                action:"checkin", nome: USER.nome, tel: USER.tel, 
                planoCadastrado: USER.plano, planoEscolhido: modoDiarista ? "Diarista" : USER.plano, 
                horario: document.getElementById('horario').value
            })});
            const json = await res.json();
            alert(json.data);
            if(json.result === "success") carregarHistorico();
        } catch(e) {
            alert("Erro ao realizar check-in.");
        }
        btn.disabled = false;
        btn.innerText = "Confirmar Presença"; 
        verificarRegras();
    }

    async function carregarHistorico() {
        try {
            const res = await fetch(URL_SCRIPT, { method:'POST', body: JSON.stringify({action:"getHistory", tel:USER.tel}) });
            const json = await res.json();
            const lista = document.getElementById('listaHistorico');
            lista.innerHTML = "";
            json.data.reverse().slice(0,5).forEach(i => {
                lista.innerHTML += `<div class="hist-item"><span>${i.data}</span><span style="color:#FFD700">${i.hora}</span></div>`;
            });
        } catch(e) {
            console.log("Erro ao carregar histórico");
        }
    }
</script>
</body>
</html>
