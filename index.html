<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal - Prof Stanlley</title>
    <style>
        :root { --amarelo: #FFD700; --preto: #000; --cinza: #111; --vermelho: #ff4d4d; }
        body { background: var(--preto); color: var(--amarelo); font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: var(--cinza); width: 95%; max-width: 400px; padding: 30px 20px; border-radius: 20px; border: 2px solid var(--amarelo); text-align: center; box-sizing: border-box; }
        input, select { width: 100%; padding: 15px; margin: 10px 0; border-radius: 8px; border: 1px solid #333; background: #000; color: #fff; font-size: 1rem; box-sizing: border-box; outline: none; }
        button { width: 100%; padding: 16px; background: var(--amarelo); color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 10px; transition: 0.3s; }
        button:disabled { background: #333; color: #666; cursor: not-allowed; }
        .btn-outline { background: transparent; color: var(--amarelo); border: 1px solid var(--amarelo); margin-top: 15px; font-size: 0.8rem; padding: 10px; cursor: pointer; border-radius: 8px; width: 100%; }
        .badge { background: var(--amarelo); color: #000; padding: 4px 12px; border-radius: 50px; font-size: 0.7rem; font-weight: bold; margin: 10px 0; display: inline-block; }
        .card-info { background: #000; border: 1px dashed var(--amarelo); padding: 15px; border-radius: 10px; margin: 15px 0; }
        .hidden { display: none; }
        .painel-admin { background: #1a1a1a; margin-top: 20px; padding: 15px; border-radius: 10px; border: 1px solid #333; text-align: left; }
        .turma-lista { font-size: 0.75rem; color: #fff; margin-bottom: 12px; border-left: 3px solid var(--amarelo); padding-left: 10px; }
        .hist-item { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; padding: 10px; border-bottom: 1px solid #222; color: #ccc; }
        .btn-toggle { background: #222; color: #fff; font-size: 0.65rem; padding: 5px 10px; width: auto; border: 1px solid #444; margin-bottom: 10px; }
    </style
